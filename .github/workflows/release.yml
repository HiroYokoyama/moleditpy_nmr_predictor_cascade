name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 — without leading v)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Verify version matches plugin source
        run: |
          FILE_VERSION=$(python3 -c "
          import re
          text = open('my_plugin/__init__.py', encoding='utf-8').read()
          m = re.search(r\"PLUGIN_VERSION\s*=\s*['\\\"](.+?)['\\\"]\", text)
          print(m.group(1).strip() if m else '')
          ")
          echo "Input version : $VERSION"
          echo "File version  : $FILE_VERSION"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: version '$VERSION' does not match PLUGIN_VERSION '$FILE_VERSION'"
            exit 1
          fi

      - name: Build release package
        run: |
          cp README.md LICENSE my_plugin/
          zip -r "my_plugin_${VERSION}.zip" my_plugin/ \
            --exclude "*/__pycache__/*" "*/.git/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --title "My Plugin $VERSION" \
            --generate-notes \
            "my_plugin_$VERSION.zip"

      # Auto-registration only works if a REGISTRY_PAT secret exists on this
      # repository, which only the registry maintainer can issue. Without it the
      # step is a no-op and the next one tells you the manual route instead.
      - name: Trigger the plugin registry update
        id: dispatch
        continue-on-error: true
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          if [ -z "$REGISTRY_PAT" ]; then
            echo "registered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $REGISTRY_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/HiroYokoyama/moleditpy-plugins/dispatches" \
            -d "{\"event_type\":\"plugin_release\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"tag\":\"v$VERSION\"}}"
          echo "registered=true" >> "$GITHUB_OUTPUT"

      - name: How to get into the plugin registry
        if: steps.dispatch.outputs.registered != 'true'
        run: |
          echo "Release published, but it was NOT registered automatically:"
          echo "no REGISTRY_PAT secret is set on this repository."
          echo
          echo "Open a 'Request Plugin Registration / Update' issue with the release URL:"
          echo "  https://github.com/HiroYokoyama/moleditpy-plugins/issues/new/choose"
          echo "  asset: my_plugin_$VERSION.zip"
